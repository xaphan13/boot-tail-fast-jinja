{% extends "layout.html" %}

{% block content %}

  {% if section is defined %}
    <h1 class="text-2xl font-bold text-heading mb-6">Раздел: {{ section }}</h1>
  {% else %}
    <h1 class="text-2xl font-bold text-heading mb-6">Статьи</h1>
  {% endif %}

  <div class="flex flex-col gap-3">
    {% for art in title_list %}
      <a class="group block bg-surface border border-line rounded-2xl p-5 shadow-sm hover:border-accent hover:-translate-y-0.5 hover:shadow-lg transition"
         href="{{ url_for('art_main.art_author', author=art.author, art_id=art.art_id) }}">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h5 class="mb-0 text-lg font-semibold text-accent group-hover:text-accent-strong transition">{{ art.title }}</h5>
          <div class="flex gap-2">
            <span class="badge">{{ art.lang }}</span>
            <span class="badge badge-accent">{{ art.author }}</span>
          </div>
        </div>
        <small class="text-sm text-muted">#{{ art.art_id }}</small>
      </a>
    {% endfor %}
  </div>

{% endblock content %}
