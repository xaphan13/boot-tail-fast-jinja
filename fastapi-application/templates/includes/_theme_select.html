{# Селектор темы сайта в шапке. 4 темы: dark, light, midnight, aurora —
   значения совпадают с VALID в scripts.js. Применяется мгновенно,
   без перезагрузки страницы; выбор хранится в localStorage['theme']. #}
<li class="nav-item hljs-theme-select-item d-flex align-items-center">
  <select class="form-select form-select-sm hljs-theme-select" id="theme-select"
          aria-label="Тема сайта">
    <option value="dark">Тёмная</option>
    <option value="light">Светлая</option>
    <option value="midnight">Полночь</option>
    <option value="aurora">Северное сияние</option>
  </select>
</li>
