{% macro footer_new(current_user) %}
  <div class="bg-surface border-t border-line">
    <div class="w-full px-4 md:px-6 py-6">
      <div class="flex flex-wrap justify-center gap-1">
        <a href="{{ url_for('main.home') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">Главная</a>
        <a href="{{ url_for('art_main.art_home') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">Статьи</a>
        <a href="{{ url_for('main.about') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">О сайте</a>
        {% if current_user.is_authenticated %}
          <a href="{{ url_for('users.account') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">Аккаунт</a>
          <a href="{{ url_for('users.logout') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">Выход</a>
        {% else %}
          <a href="{{ url_for('users.login') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">Вход</a>
          <a href="{{ url_for('users.register') }}" class="px-3 py-1.5 rounded-lg text-sm text-muted hover:text-accent hover:bg-surface-2 transition">Регистрация</a>
        {% endif %}
      </div>

      <p class="text-center text-sm text-muted mt-4 mb-0">© 2024 Xaphan Company, Inc</p>
    </div>
  </div>
{% endmacro %}
